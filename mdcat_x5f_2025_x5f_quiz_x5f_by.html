@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap');
html { scroll-padding-top: calc(var(--safe-area-inset-top, 0px) + 84px); }
body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background: #1e1440; color: #1e293b; }
.font-display { font-family: 'Sora', 'Inter', ui-sans-serif, system-ui, sans-serif; }

/* ---------- scenic sky ---------- */
.sky-bg { background: linear-gradient(180deg, #13132e 0%, #2a1a5e 18%, #5b2a9d 34%, #a83a86 48%, #e0566e 60%, #f98a4b 71%, #fbbf24 82%, #fde68a 100%); }
.sun { position: absolute; top: 7%; right: 9%; width: 130px; height: 130px; border-radius: 50%;
  background: radial-gradient(circle, #fffbe8 0%, #fde68a 38%, #fbbf24 62%, rgba(251,191,36,0) 72%);
  animation: sunglow 7s ease-in-out infinite; }
@keyframes sunglow { 0%,100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.08); opacity: 1; } }
.star { position: absolute; border-radius: 9999px; background: #fff; animation: twinkle ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: .12; transform: scale(.75); } 50% { opacity: .95; transform: scale(1.15); } }
.cloud-track { position: absolute; left: -170px; animation-name: drift; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(135vw); } }
.cloud { position: relative; width: 120px; height: 36px; background: rgba(255,255,255,.92); border-radius: 9999px; transform-origin: left center; }
.cloud::before { content: ""; position: absolute; width: 58px; height: 58px; background: rgba(255,255,255,.92); border-radius: 50%; top: -26px; left: 22px; }
.cloud::after { content: ""; position: absolute; width: 40px; height: 40px; background: rgba(255,255,255,.92); border-radius: 50%; top: -17px; left: 66px; }
.particle { position: absolute; border-radius: 9999px; background: rgba(255,255,255,.7); animation: floatdust ease-in-out infinite; }
@keyframes floatdust { 0%,100% { transform: translateY(0); opacity: .25; } 50% { transform: translateY(-26px); opacity: .8; } }

@keyframes qin { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.animate-qin { animation: qin 0.28s ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.animate-fadein { animation: fadein 0.25s ease both; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
.animate-shake { animation: shake 0.45s ease both; }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
.confetti-piece { position: absolute; top: -16px; border-radius: 2px; animation: confettifall linear infinite; }
@keyframes confettifall { to { transform: translateY(640px) rotate(720deg); } }
.nice-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.nice-scroll::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.35); border-radius: 8px; }
